# ─── Admin Interface ─────────────────────────────────────────────────────────
admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901
  allow_paths:
    - exact: /ready
    - prefix: /stats/prometheus
    - prefix: /clusters
    - prefix: /config_dump
  access_log:
    - name: envoy.access_loggers.stdout
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog

# ─── Static Resources ────────────────────────────────────────────────────────
static_resources:

  # ── Listeners ──────────────────────────────────────────────────────────────
  listeners:
    - name: spotq_http_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 10000
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: AUTO
                generate_request_id: true
                upgrade_configs:
                  - upgrade_type: websocket

                # ── Custom JSON Local Reply / Error Format ─────────────────
                local_reply_config:
                  body_format:
                    json_format:
                      success: false
                      message: "%LOCAL_REPLY_BODY%"
                      code: "%RESPONSE_CODE%"
                      error: "%RESPONSE_CODE_DETAILS%"
                      statusCode: "%RESPONSE_CODE%"
                    content_type: "application/json; charset=UTF-8"

                # ── Route Configuration ────────────────────────────────────
                route_config:
                  name: spotq_routes
                  virtual_hosts:
                    - name: spotq_api
                      domains: ["*"]

                      # ── Header Sanitization ──────────────────────────────
                      request_headers_to_remove:
                        - "x-user-id"
                        - "x-user-email"
                        - "x-user-role"
                        - "x-restaurant-id"

                      # ── CORS Policy ──────────────────────────────────────
                      typed_per_filter_config:
                        envoy.filters.http.cors:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                          allow_origin_string_match:
                            - safe_regex:
                                regex: "^https?://(localhost|127\\.0\\.0\\.1)(:[0-9]+)?$"
                            - safe_regex:
                                regex: "^https://([a-zA-Z0-9-]+\\.)*spotq\\.com(:[0-9]+)?$"
                          allow_methods: "GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD"
                          allow_headers: "Content-Type, Authorization, X-Request-ID, X-Requested-With, Accept, Origin"
                          expose_headers: "X-Request-ID, Content-Length, Content-Range"
                          allow_credentials: true
                          max_age: "86400"

                      # ── Route Matching Rules ────────────────────────────
                      routes:
                        # Health Check
                        - match:
                            path: "/healthz"
                          direct_response:
                            status: 200
                            body:
                              inline_string: '{"status":"healthy","service":"spotq-api-gateway"}'

                        # ── WebSocket Routes ─────────────────────────────
                        - match:
                            path: "/ws/queues"
                            headers:
                              - name: "Upgrade"
                                string_match:
                                  exact: "websocket"
                          route:
                            cluster: queue_service
                            prefix_rewrite: "/ws"
                            timeout: 0s
                            idle_timeout: 3600s
                            upgrade_configs:
                              - upgrade_type: websocket
                                enabled: true

                        # ── User Auth Routes (Routed to User Service) ────
                        - match:
                            path_separated_prefix: "/api/v1/auth/users"
                          route:
                            regex_rewrite:
                              pattern:
                                regex: "^/api/v1/auth/users/?(.*)"
                              substitution: "/\\1"
                            cluster: user_service
                            timeout: 30s
                            retry_policy: &default_retry_policy
                              retry_on: "5xx,connect-failure,refused-stream"
                              num_retries: 2
                              per_try_timeout: 10s
                              retriable_request_headers:
                                - name: ":method"
                                  string_match:
                                    safe_regex:
                                      regex: "^(GET|HEAD|OPTIONS|PUT|DELETE)$"

                        # ── Restaurant Auth Routes (Routed to Restaurant Service)
                        - match:
                            path_separated_prefix: "/api/v1/auth/restaurants"
                          route:
                            regex_rewrite:
                              pattern:
                                regex: "^/api/v1/auth/restaurants/?(.*)"
                              substitution: "/\\1"
                            cluster: restaurant_service
                            timeout: 30s
                            retry_policy: *default_retry_policy

                        # ── Admin Auth Routes (Routed to User Service) ───
                        - match:
                            path_separated_prefix: "/api/v1/auth/admin"
                          route:
                            regex_rewrite:
                              pattern:
                                regex: "^/api/v1/auth/admin/?(.*)"
                              substitution: "/admin/\\1"
                            cluster: user_service
                            timeout: 30s
                            retry_policy: *default_retry_policy

                        # ── User Service Routes ──────────────────────────
                        - match:
                            path_separated_prefix: "/api/v1/users"
                          route:
                            regex_rewrite:
                              pattern:
                                regex: "^/api/v1/users/?(.*)"
                              substitution: "/\\1"
                            cluster: user_service
                            timeout: 30s
                            retry_policy: *default_retry_policy

                        # ── Admin Routes ─────────────────────────────────
                        - match:
                            path_separated_prefix: "/api/v1/admin"
                          route:
                            regex_rewrite:
                              pattern:
                                regex: "^/api/v1/admin/?(.*)"
                              substitution: "/admin/\\1"
                            cluster: user_service
                            timeout: 30s
                            retry_policy: *default_retry_policy

                        # ── Restaurant Service Routes ────────────────────
                        - match:
                            path_separated_prefix: "/api/v1/restaurants"
                          route:
                            regex_rewrite:
                              pattern:
                                regex: "^/api/v1/restaurants/?(.*)"
                              substitution: "/\\1"
                            cluster: restaurant_service
                            timeout: 30s
                            retry_policy: *default_retry_policy

                        # ── Order Service Routes ─────────────────────────
                        - match:
                            path_separated_prefix: "/api/v1/orders"
                          route:
                            regex_rewrite:
                              pattern:
                                regex: "^/api/v1/orders/?(.*)"
                              substitution: "/\\1"
                            cluster: order_service
                            timeout: 30s
                            retry_policy: *default_retry_policy

                        # ── Payment Service Routes ───────────────────────
                        - match:
                            path_separated_prefix: "/api/v1/payments"
                          route:
                            regex_rewrite:
                              pattern:
                                regex: "^/api/v1/payments/?(.*)"
                              substitution: "/\\1"
                            cluster: payment_service
                            timeout: 30s
                            retry_policy: *default_retry_policy

                        # ── Queue Service Routes ─────────────────────────
                        - match:
                            path_separated_prefix: "/api/v1/queues"
                          route:
                            regex_rewrite:
                              pattern:
                                regex: "^/api/v1/queues/?(.*)"
                              substitution: "/\\1"
                            cluster: queue_service
                            timeout: 30s
                            retry_policy: *default_retry_policy

                # ── HTTP Filters ───────────────────────────────────────────
                http_filters:
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors

                  # ── JWT Authentication & Claim Extraction ─────────────────
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        spotq_jwt:
                          remote_jwks:
                            http_uri:
                              uri: "http://user-service:3000/.well-known/jwks.json"
                              cluster: user_service
                              timeout: 2s
                            cache_duration: 300s
                          from_headers:
                            - name: Authorization
                              value_prefix: "Bearer "
                          claim_to_headers:
                            - header_name: "x-user-id"
                              claim_name: "sub"
                            - header_name: "x-user-email"
                              claim_name: "email"
                            - header_name: "x-user-role"
                              claim_name: "role"
                            - header_name: "x-restaurant-id"
                              claim_name: "restaurantId"

                      rules:
                        # Public: Health check
                        - match:
                            path: "/healthz"

                        # Public: Auth endpoints (e.g. /api/v1/auth/*)
                        - match:
                            path_separated_prefix: "/api/v1/auth"

                        # Public: Landing page showcase (GET restaurants only)
                        - match:
                            path_separated_prefix: "/api/v1/restaurants"
                            headers:
                              - name: ":method"
                                exact_match: "GET"

                        # Protected: Require JWT for all other /api/v1/ routes (like /api/v1/users)
                        - match:
                            prefix: "/api/v1/"
                          requires:
                            provider_name: spotq_jwt

                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

                # ── Access Logging ─────────────────────────────────────────
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          timestamp: "%START_TIME%"
                          method: "%REQ(:METHOD)%"
                          path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                          protocol: "%PROTOCOL%"
                          response_code: "%RESPONSE_CODE%"
                          response_flags: "%RESPONSE_FLAGS%"
                          duration_ms: "%DURATION%"
                          upstream_host: "%UPSTREAM_HOST%"
                          upstream_cluster: "%UPSTREAM_CLUSTER%"
                          request_id: "%REQ(X-REQUEST-ID)%"
                          bytes_received: "%BYTES_RECEIVED%"
                          bytes_sent: "%BYTES_SENT%"

  # ── Clusters (Backend Services) ──────────────────────────────────────────
  clusters:

    # ── User Service ─────────────────────────────────────────────────────
    - name: user_service
      type: STRICT_DNS
      connect_timeout: 5s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: user_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: user-service
                      port_value: 3000
      health_checks:
        - &default_health_check
          timeout: 5s
          interval: 10s
          unhealthy_threshold: 3
          healthy_threshold: 2
          http_health_check:
            path: "/health"

    # ── Restaurant Service ───────────────────────────────────────────────
    - name: restaurant_service
      type: STRICT_DNS
      connect_timeout: 5s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: restaurant_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: restaurant-service
                      port_value: 3001
      health_checks:
        - *default_health_check

    # ── Order Service ────────────────────────────────────────────────────
    - name: order_service
      type: STRICT_DNS
      connect_timeout: 5s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: order_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: order-service
                      port_value: 3002
      health_checks:
        - *default_health_check

    # ── Payment Service ──────────────────────────────────────────────────
    - name: payment_service
      type: STRICT_DNS
      connect_timeout: 5s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: payment_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: payment-service
                      port_value: 3003
      health_checks:
        - *default_health_check

    # ── Queue Service ────────────────────────────────────────────────────
    - name: queue_service
      type: STRICT_DNS
      connect_timeout: 5s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: queue_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: queue-service
                      port_value: 3004
      health_checks:
        - *default_health_check
