# ─── Admin Interface ─────────────────────────────────────────────────────────
# Accessible at http://localhost:9901 for monitoring and debugging.
# Restricted via allow_paths. Production deployments must enforce a private-network boundary.
# Endpoints:
#   /stats/prometheus  - Prometheus-compatible metrics (request count, error count,
#                        response latency, active connections)
#   /clusters          - Cluster health and connection info
#   /config_dump       - Full configuration dump
#   /ready             - Health/readiness check
admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901
  allow_paths:
    - exact: /ready
    - prefix: /stats/prometheus
    - prefix: /clusters
    - prefix: /config_dump
  access_log:
    - name: envoy.access_loggers.stdout
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog

# ─── Static Resources ────────────────────────────────────────────────────────
static_resources:

  # ── Listeners ──────────────────────────────────────────────────────────────
  listeners:
    - name: spotq_http_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 10000
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: AUTO
                generate_request_id: true

                # ── WebSocket Upgrade Configuration ───────────────────────
                # Enables HTTP → WebSocket upgrade on this listener.
                # Without this, Envoy will reject Upgrade: websocket requests.
                upgrade_configs:
                  - upgrade_type: websocket

                # ── Route Configuration ────────────────────────────────────
                route_config:
                  name: spotq_routes
                  virtual_hosts:
                    - name: spotq_api
                      domains: ["*"]

                      # ── CORS Policy ──────────────────────────────────────
                      typed_per_filter_config:
                        envoy.filters.http.cors:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                          allow_origin_string_match:
                            - safe_regex:
                                regex: ".*"
                          allow_methods: "GET, POST, PUT, PATCH, DELETE, OPTIONS"
                          allow_headers: "Content-Type, Authorization, X-Request-ID"
                          allow_credentials: true 
                          max_age: "86400"

                      # ── Route Matching Rules ────────────────────────────
                      routes:
                        # Health check endpoint (handled by Envoy directly)
                        - match:
                            path: "/healthz"
                          direct_response:
                            status: 200
                            body:
                              inline_string: '{"status":"healthy","service":"spotq-api-gateway"}'

                        # ── WebSocket Routes ─────────────────────────────
                        # Real-time WebSocket connections proxied to backend services.
                        # timeout: 0s  → disables per-request deadline (WS connections
                        #               are long-lived; a non-zero timeout would close
                        #               the socket after that duration).
                        # No retry_policy → retries are meaningless for stateful
                        #                   WebSocket connections.

                        # Queue Service WebSocket
                        # Handles real-time queue status updates and position tracking.
                        # Ingress:  ws://host:10000/ws/queues
                        # Upstream: ws://queue-service:3004/ws
                        #
                        # path (exact) is used instead of prefix so that only
                        # /ws/queues is matched. prefix would also match
                        # /ws/queuesfoo or /ws/queues/status, which is unintended.
                        # Envoy excludes query strings from path matching, so
                        # ws://host:10000/ws/queues?token=... still works.
                        - match:
                            path: "/ws/queues"
                            headers:
                              - name: "Upgrade"
                                string_match:
                                  exact: "websocket"
                          route:
                            cluster: queue_service
                            prefix_rewrite: "/ws"
                            # timeout: 0s disables the per-request deadline so Envoy
                            # does not close the socket after a fixed duration.
                            timeout: 0s
                            # idle_timeout must also be set explicitly. Without it,
                            # Envoy falls back to the HCM stream_idle_timeout which
                            # defaults to 5 minutes — silently killing any WebSocket
                            # that carries no bytes for that period (e.g. a quiet queue).
                            # 3600s (1 h) is a safe ceiling; the queue-service must send
                            # WebSocket ping frames at an interval shorter than this
                            # (e.g. every 30 s) so that dead connections are detected
                            # at the application layer before Envoy's idle timer fires.
                            idle_timeout: 3600s
                            upgrade_configs:
                              - upgrade_type: websocket
                                enabled: true

                        # ── User Service Routes ──────────────────────────
                        - match:
                            path_separated_prefix: "/api/v1/users"
                          route:
                            regex_rewrite:
                              pattern:
                                regex: "^/api/v1/users/?(.*)"
                              substitution: "/\\1"
                            cluster: user_service
                            timeout: 30s
                            retry_policy:
                              retry_on: "5xx,connect-failure,refused-stream"
                              num_retries: 2
                              per_try_timeout: 10s
                              retriable_request_headers:
                                - name: ":method"
                                  string_match:
                                    safe_regex:
                                      regex: "^(GET|HEAD|OPTIONS|PUT|DELETE)$"

                        # ── Restaurant Service Routes ────────────────────
                        - match:
                            path_separated_prefix: "/api/v1/restaurants"
                          route:
                            regex_rewrite:
                              pattern:
                                regex: "^/api/v1/restaurants/?(.*)"
                              substitution: "/\\1"
                            cluster: restaurant_service
                            timeout: 30s
                            retry_policy:
                              retry_on: "5xx,connect-failure,refused-stream"
                              num_retries: 2
                              per_try_timeout: 10s
                              retriable_request_headers:
                                - name: ":method"
                                  string_match:
                                    safe_regex:
                                      regex: "^(GET|HEAD|OPTIONS|PUT|DELETE)$"

                        # ── Order Service Routes ─────────────────────────
                        - match:
                            path_separated_prefix: "/api/v1/orders"
                          route:
                            regex_rewrite:
                              pattern:
                                regex: "^/api/v1/orders/?(.*)"
                              substitution: "/\\1"
                            cluster: order_service
                            timeout: 30s
                            retry_policy:
                              retry_on: "5xx,connect-failure,refused-stream"
                              num_retries: 2
                              per_try_timeout: 10s
                              retriable_request_headers:
                                - name: ":method"
                                  string_match:
                                    safe_regex:
                                      regex: "^(GET|HEAD|OPTIONS|PUT|DELETE)$"

                        # ── Payment Service Routes ───────────────────────
                        - match:
                            path_separated_prefix: "/api/v1/payments"
                          route:
                            regex_rewrite:
                              pattern:
                                regex: "^/api/v1/payments/?(.*)"
                              substitution: "/\\1"
                            cluster: payment_service
                            timeout: 30s
                            retry_policy:
                              retry_on: "5xx,connect-failure,refused-stream"
                              num_retries: 2
                              per_try_timeout: 10s
                              retriable_request_headers:
                                - name: ":method"
                                  string_match:
                                    safe_regex:
                                      regex: "^(GET|HEAD|OPTIONS|PUT|DELETE)$"

                        # ── Queue Service Routes ─────────────────────────
                        - match:
                            path_separated_prefix: "/api/v1/queues"
                          route:
                            regex_rewrite:
                              pattern:
                                regex: "^/api/v1/queues/?(.*)"
                              substitution: "/\\1"
                            cluster: queue_service
                            timeout: 30s
                            retry_policy:
                              retry_on: "5xx,connect-failure,refused-stream"
                              num_retries: 2
                              per_try_timeout: 10s
                              retriable_request_headers:
                                - name: ":method"
                                  string_match:
                                    safe_regex:
                                      regex: "^(GET|HEAD|OPTIONS|PUT|DELETE)$"

                # ── HTTP Filters ───────────────────────────────────────────
                http_filters:
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

                # ── Access Logging ─────────────────────────────────────────
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          timestamp: "%START_TIME%"
                          method: "%REQ(:METHOD)%"
                          path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                          protocol: "%PROTOCOL%"
                          response_code: "%RESPONSE_CODE%"
                          response_flags: "%RESPONSE_FLAGS%"
                          duration_ms: "%DURATION%"
                          upstream_host: "%UPSTREAM_HOST%"
                          upstream_cluster: "%UPSTREAM_CLUSTER%"
                          request_id: "%REQ(X-REQUEST-ID)%"
                          bytes_received: "%BYTES_RECEIVED%"
                          bytes_sent: "%BYTES_SENT%"

  # ── Clusters (Backend Services) ──────────────────────────────────────────
  clusters:

    # ── User Service ─────────────────────────────────────────────────────
    - name: user_service
      type: STRICT_DNS
      connect_timeout: 5s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: user_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: user-service
                      port_value: 3000 # Container running port
      health_checks:
        - timeout: 5s
          interval: 10s
          unhealthy_threshold: 3
          healthy_threshold: 2
          http_health_check:
            path: "/health"

    # ── Restaurant Service ───────────────────────────────────────────────
    - name: restaurant_service
      type: STRICT_DNS
      connect_timeout: 5s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: restaurant_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: restaurant-service
                      port_value: 3001 # Container running port
      health_checks:
        - timeout: 5s
          interval: 10s
          unhealthy_threshold: 3
          healthy_threshold: 2
          http_health_check:
            path: "/health"

    # ── Order Service ────────────────────────────────────────────────────
    - name: order_service
      type: STRICT_DNS
      connect_timeout: 5s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: order_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: order-service
                      port_value: 3002 # Container running port
      health_checks:
        - timeout: 5s
          interval: 10s
          unhealthy_threshold: 3
          healthy_threshold: 2
          http_health_check:
            path: "/health"

    # ── Payment Service ──────────────────────────────────────────────────
    - name: payment_service
      type: STRICT_DNS
      connect_timeout: 5s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: payment_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: payment-service
                      port_value: 3003 # Container running port
      health_checks:
        - timeout: 5s
          interval: 10s
          unhealthy_threshold: 3
          healthy_threshold: 2
          http_health_check:
            path: "/health"

    # ── Queue Service ────────────────────────────────────────────────────
    - name: queue_service
      type: STRICT_DNS
      connect_timeout: 5s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: queue_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: queue-service
                      port_value: 3004 # Container running port
      health_checks:
        - timeout: 5s
          interval: 10s
          unhealthy_threshold: 3
          healthy_threshold: 2
          http_health_check:
            path: "/health"
